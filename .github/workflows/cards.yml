name: Build Cards

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v30
    - name: Build cards
      run: |
        nix build
    - uses: actions/upload-artifact@v4
      with:
        name: cards
        path: result
